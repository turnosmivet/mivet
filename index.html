    <!-- Adelanta las descargas de la ruta actual: sin esto la foto o el póster se piden recién
         cuando React ya arrancó (y, en Equipo, después de importar el script del efecto). -->
    <script>
      (function () {
        var base = '/mivet/'
        var movil = window.matchMedia('(max-width: 767px)').matches
        var ruta = location.hash.replace(/^#/, '') || '/'
        function pre(rel, href, extra) {
          var l = document.createElement('link')
          l.rel = rel
          l.href = base + href
          for (var k in extra) l[k] = extra[k]
          document.head.appendChild(l)
        }
        if (ruta === '/') {
          pre('preload', 'video/hero-' + (movil ? 'mobile' : 'desktop') + '-poster.webp', { as: 'image' })
        } else if (ruta.indexOf('/equipo') === 0) {
          pre('preload', 'assets/equipo/equipo-' + (movil ? 'mobile' : 'desktop') + '.webp', { as: 'image', fetchPriority: 'high' })
          pre('modulepreload', 'assets/equipo/equipo-interactivo.js', {})
        } else if (ruta.indexOf('/servicios') === 0) {
          pre('preload', 'assets/servicios/atencion-mobile.webp', { as: 'image', fetchPriority: 'high' })
        }
      })()
    </script>
